[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veloroute"
version = "0.1.0"
description = "Leakage-audited RNA velocity research execution framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.11,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
model = ["torch>=2.6,<2.7"]

[project.scripts]
veloroute = "veloroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
