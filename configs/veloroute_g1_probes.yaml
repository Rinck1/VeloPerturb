limitations:
  - Fixed expression-OT pseudo-pairs can miss increments requiring a different coupling or richer predictor.
  - A negative probe is not an information-theoretic upper bound or proof against every velocity router.
  - B0 shares A0; B2 training U-predictions are cross-fitted.
  - Permutations are within condition and fixed log2 depth strata, in source-PC1-sorted local blocks.
  - Numerical gate success yields REVIEW_REQUIRED, not automatic G1-GO.
  - Future validation outcomes are read only after all predictions are saved and hashed.
