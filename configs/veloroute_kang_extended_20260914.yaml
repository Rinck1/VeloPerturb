    arm: gfg_joint
    experts: 8
    adaptive: true
    gate: true
    intrinsic: true
  - name: full_GFG_shuffled_U
    arm: gfg_joint_shuffled
    experts: 8
    adaptive: true
    gate: true
    intrinsic: true
  - name: full_static_matched
    arm: static
    experts: 8
    adaptive: true
    gate: false
    intrinsic: false
    force_gate: 1.0
  - name: full_GFG_K1
    arm: gfg_joint
    experts: 1
    adaptive: false
    gate: true
    intrinsic: true
  - name: full_GFG_K2
    arm: gfg_joint
    experts: 2
    adaptive: false
    gate: true
    intrinsic: true
  - name: full_GFG_K8
    arm: gfg_joint
    experts: 8
    adaptive: false
